name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */4 * *' # Roda a cada 4 dias às 12:00 UTC
  workflow_dispatch: # Permite rodar manualmente para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/user_progress?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.ANON_PUBLIC_KEY }}"
